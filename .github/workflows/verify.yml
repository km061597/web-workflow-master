name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Run repository verification
        run: npm test

      - name: Verify Autoplan Board package
        run: npm run dashboard:verify

      - name: Test Autoplan Board package
        run: npm run dashboard:test

      - name: Install Autoplan smoke browser
        run: npx playwright install chromium

      - name: Run Autoplan ship gate
        run: npm run ship-gate
