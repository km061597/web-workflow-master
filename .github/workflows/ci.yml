name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install root deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Validate script syntax
        run: npm run validate

      - name: Verify Autoplan Board package
        run: npm run dashboard:verify

      - name: Test Autoplan Board package
        run: npm run dashboard:test

      - name: Install Autoplan smoke browser
        run: npx playwright install chromium

      - name: Run Autoplan ship gate
        run: npm run ship-gate

      - name: Check formatting
        run: npm run format:check

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install root deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  scaffold-nextjs:
    name: Next.js Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/nextjs-canonical
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/nextjs-canonical/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scaffold-astro:
    name: Astro Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/astro-canonical
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/astro-canonical/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scaffold-local-business:
    name: Local Business Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/local-business-template
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/local-business-template/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
