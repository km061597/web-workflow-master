name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install root deps
        run: npm ci

      - name: Validate script syntax
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

  scaffold-nextjs:
    name: Next.js Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/nextjs-canonical
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/nextjs-canonical/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scaffold-astro:
    name: Astro Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/astro-canonical
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/astro-canonical/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scaffold-local-business:
    name: Local Business Scaffold
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaffolds/local-business-template
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "scaffolds/local-business-template/package-lock.json"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
